name: Firebase backend
on:
  pull_request:
  push:
    branches: [dev-staging, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:deploy-package --workspace src/functions
      - run: npm test
      - run: npm run test:rules --workspace src/functions
      - run: npm run test:integration --workspace src/functions
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-staging'
    needs: verify
    runs-on: ubuntu-latest
    # Configure these public Firebase Web values as repository variables.
    # The VITE_USE_FIREBASE_EMULATORS value is always false in deployed builds.
    env:
      VITE_FIREBASE_ENV: development
      VITE_USE_FIREBASE_EMULATORS: 'false'
      VITE_FIREBASE_DEV_API_KEY: ${{ vars.VITE_FIREBASE_DEV_API_KEY }}
      VITE_FIREBASE_DEV_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_DEV_AUTH_DOMAIN }}
      VITE_FIREBASE_DEV_PROJECT_ID: ${{ vars.VITE_FIREBASE_DEV_PROJECT_ID }}
      VITE_FIREBASE_DEV_APP_ID: ${{ vars.VITE_FIREBASE_DEV_APP_ID }}
      VITE_FIREBASE_DEV_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_DEV_MESSAGING_SENDER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HELPINUS_DEV }}
      - run: npx firebase-tools deploy --only hosting,functions,firestore:rules,firestore:indexes --project helpinus-dev --non-interactive
  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    # Configure the production web values as production environment variables.
    # Firebase Web configuration is public; service-account credentials remain secrets.
    env:
      VITE_FIREBASE_ENV: production
      VITE_USE_FIREBASE_EMULATORS: 'false'
      VITE_FIREBASE_PROD_API_KEY: ${{ vars.VITE_FIREBASE_PROD_API_KEY }}
      VITE_FIREBASE_PROD_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_PROD_AUTH_DOMAIN }}
      VITE_FIREBASE_PROD_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROD_PROJECT_ID }}
      VITE_FIREBASE_PROD_APP_ID: ${{ vars.VITE_FIREBASE_PROD_APP_ID }}
      VITE_FIREBASE_PROD_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_PROD_MESSAGING_SENDER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HELPINUS_PROD }}
      - run: npx firebase-tools deploy --only hosting,functions,firestore:rules,firestore:indexes --project helpinus-prod --non-interactive
