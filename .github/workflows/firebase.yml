name: Firebase backend
on:
  pull_request:
  push:
    branches: [dev-staging, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:rules --workspace src/functions
      - run: npm run test:integration --workspace src/functions
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-staging'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HELPINUS_DEV }}
      - run: npx firebase-tools deploy --only hosting,functions,firestore:rules,firestore:indexes --project helpinus-dev --non-interactive
  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HELPINUS_PROD }}
      - run: npx firebase-tools deploy --only hosting,functions,firestore:rules,firestore:indexes --project helpinus-prod --non-interactive
